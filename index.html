<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus - Buscar Viaje</title>
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>

  <header>
    <img src="images/logo.png" alt="Logotipo de QuiBus, un autobús estilizado en color rojo">
    <h1>QuiBus</h1>

    <nav aria-label="Menú principal">
      <ul>
        <li><a href="index.html" aria-current="page">Inicio</a></li>
        <li><a href="pages/paradas-cercanas.html">Paradas</a></li>
        <li><a href="pages/favoritos.html">Favoritos</a></li>
        <li><a href="pages/perfil.html">Perfil</a></li>
        <li><a href="pages/login.html">Cuenta</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido principal de la pagina: busqueda, mapa y resultados -->
  <main>

    <section aria-label="Formulario de búsqueda de viaje">
      <h2>Buscar Viaje</h2>

      <form action="#" method="get">
  <div class="form-row">
    <div class="form-group">
      <label for="origen">Origen</label>
      <input type="text" id="origen" name="origen" placeholder="Ingresa tu punto de partida">
    </div>
    <div class="form-group">
      <label for="destino">Destino</label>
      <input type="text" id="destino" name="destino" placeholder="Ingresa tu destino">
    </div>
  </div>

  <button type="submit">Buscar</button>
</form>
    </section>

    <section class="mapa-card" aria-label="Mapa de rutas">
  <h2>Mapa de rutas</h2>
  <div id="mapa-index" class="leaflet-mapa" role="img" aria-label="Mapa de cobertura de QuiBus en Quito con las paradas disponibles"></div>
</section>

    <!-- Contenido secundario: rutas mas rapidas de la red.
         Antes aqui habia tres tarjetas fijas bajo el titulo "Resultados de
         Busqueda" que ningun script actualizaba nunca, y daban a entender que
         ya se habia hecho una busqueda. Ahora las pinta js/buscar.js leyendo
         de data.js, y el titulo dice lo que la lista es de verdad. -->
    <aside class="resultados-lista" aria-labelledby="titulo-rutas-rapidas">
      <h2 id="titulo-rutas-rapidas">Rutas más rápidas</h2>
    </aside>

  </main>

  <footer>
    <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
  </footer>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/buscar.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { map, capaMarcadores } = initQuiBusMapa("mapa-index") || {};
      const paradasUnicas = Object.values(
        QUIBUS_RUTAS.reduce((acc, ruta) => {
          acc[ruta.parada] = { nombre: ruta.parada, coords: ruta.coords, rutas: [ruta.id] };
          return acc;
        }, {})
      );
      pintarParadasEnMapa(map, capaMarcadores, paradasUnicas);
    });
  </script>
</body>
</html>
