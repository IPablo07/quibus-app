<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus - Buscar Viaje</title>
</head>
<body>

  <header>
    <img src="images/logo.png" alt="Logotipo de QuiBus, un autobús estilizado en color rojo">
    <h1>QuiBus</h1>

    <nav aria-label="Menú principal">
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Paradas</a></li>
        <li><a href="#">Favoritos</a></li>
        <li><a href="#">Cuenta</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido principal de la pagina: busqueda, mapa y resultados -->
  <main>

    <section aria-label="Formulario de búsqueda de viaje">
      <h2>Buscar Viaje</h2>

      <form action="#" method="get">
        <label for="origen">Origen</label>
        <input type="text" id="origen" name="origen" placeholder="Ingresa tu punto de partida">

        <label for="destino">Destino</label>
        <input type="text" id="destino" name="destino" placeholder="Ingresa tu destino">

        <button type="submit">Buscar</button>
      </form>
    </section>

    <section aria-label="Mapa de rutas">
      <h2>Mapa de rutas</h2>
      <img src="images/banner.jpg" alt="Mapa de la ciudad con las rutas de bus marcadas en distintos colores">
    </section>
<!-- Contenido secundario: lista de rutas relacionadas a la busqueda -->
    <aside aria-label="Resultados de búsqueda"><aside aria-label="Resultados de búsqueda">
      <h2>Resultados de Búsqueda</h2>

      <article>
        <h3>T1 - Ruta de Bus</h3>
        <p>Tiempo estimado: 15 min</p>
        <p>Parada: Parque Carolina</p>
      </article>

      <article>
        <h3>Ruta de Bus</h3>
        <p>Tiempo estimado: 45 min</p>
        <p>Parada: El Playón</p>
      </article>

      <article>
        <h3>T8 - Ruta de Bus</h3>
        <p>Tiempo estimado: 15
