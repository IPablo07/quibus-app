<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus - Perfil</title>
  <link rel="stylesheet" href="../css/styles.css?v=3">
</head>
<body class="perfil-body">

  <header class="perfil-header">
    <!-- Antes era un <button> sin ningún manejador: se podía enfocar y pulsar,
         pero no hacía nada. Como enlace tiene destino real y funciona igual que
         la flecha de registro.html. -->
    <a href="../index.html" class="icon-btn" aria-label="Volver al inicio">←</a>
    <!-- Título de la página: era <h2> sin que existiera ningún <h1>. -->
    <h1>Perfil</h1>
  </header>

  <main class="perfil-main">
    <article class="profile-card">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
      </div>
      <div class="profile-card__info">
       <h2 id="nombreUsuario">Juan Serrano</h2>
        <p>juan.serrano@ejemplo.com</p>
      </div>
    </article>

    <nav class="profile-menu" aria-label="Menú de perfil">
      <a href="favoritos.html" class="profile-menu__item">♡ Favoritos</a>
      <a href="ayuda.html" class="profile-menu__item">◎ Ayuda</a>
      <button type="button" class="profile-menu__item profile-menu__item--danger" id="btnLogout">← Cerrar sesión</button>
    </nav>

    <!-- Diálogo de confirmación.
         role="dialog" + aria-modal anuncian que lo de detrás queda inerte, y
         aria-labelledby hace que el lector de pantalla lea la pregunta como
         nombre del diálogo al abrirlo. El foco lo gestiona js/modal.js. -->
    <div class="alert-box" id="logoutAlert" role="dialog" aria-modal="true"
         aria-labelledby="tituloLogout" hidden>
      <p id="tituloLogout">¿Seguro que deseas cerrar sesión?</p>
      <div class="alert-box__actions">
        <button type="button" class="alert-box__cancel" id="cancelLogout">Cancelar</button>
        <button type="button" class="alert-box__confirm" id="confirmLogout">Cerrar sesión</button>
      </div>
    </div>
  </main>

  <footer class="perfil-footer">
  <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
</footer>

  <script src="../js/modal.js"></script>
  <script>
    const alertBox = document.getElementById('logoutAlert');

    // El foco arranca en "Cancelar": es la opción segura, y así una pulsación
    // accidental de Enter no cierra la sesión.
    const dialogoLogout = iniciarModal(alertBox, { focoInicial: '#cancelLogout' });

    document.getElementById('btnLogout').addEventListener('click', dialogoLogout.abrir);
    document.getElementById('cancelLogout').addEventListener('click', dialogoLogout.cerrar);
    document.getElementById('confirmLogout').addEventListener('click', () => {
      window.location.href = '../index.html';
    });
    // Cargar nombre del usuario desde localStorage
  document.addEventListener("DOMContentLoaded", () => {
    const usuarioGuardado = localStorage.getItem("usuarioActual");
    if (usuarioGuardado) {
      const usuario = JSON.parse(usuarioGuardado);
      const nombreUsuario = document.getElementById("nombreUsuario");
      if (nombreUsuario) {
        nombreUsuario.textContent = usuario.nombre + " " + usuario.apellido;
      }
      // También puedes actualizar el email si lo deseas
      const emailElement = document.querySelector(".profile-card__info p");
      if (emailElement) {
        emailElement.textContent = usuario.email;
      }
    }
  });
  </script>

</body>
</html>
