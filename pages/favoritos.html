<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rutas favoritas guardadas por el usuario en QuiBus">
  <title>QuiBus - Favoritos</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header>
    <img src="../images/logo.png" alt="Logotipo de QuiBus, un autobús estilizado en color rojo">
    <h1>QuiBus</h1>

    <nav aria-label="Menú principal">
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="paradas-cercanas.html">Paradas</a></li>
        <li><a href="favoritos.html" aria-current="page">Favoritos</a></li>
        <li><a href="login.html">Cuenta</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section aria-labelledby="titulo-favoritos">
      <h2 id="titulo-favoritos">Favoritos</h2>

      <ul>
        <li>
          <button type="button" class="ruta-favorita" aria-label="Ruta favorita, desde Casa hasta Universidad">
            Casa &rarr; Universidad
          </button>
        </li>
        <li>
          <button type="button" class="ruta-favorita" aria-label="Ruta favorita, desde Casa hasta Trabajo">
            Casa &rarr; Trabajo
          </button>
        </li>
        <li>
          <button type="button" class="ruta-favorita" aria-label="Ruta favorita, desde CCI hasta Labrador">
            CCI &rarr; Labrador
          </button>
        </li>
        <li>
          <button type="button" class="ruta-favorita" aria-label="Ruta favorita, desde Iñaquito hasta Mena II">
            Iñaquito &rarr; Mena II
          </button>
        </li>
      </ul>

     <button type="button" class="boton-anadir" aria-label="Añadir nueva ruta favorita">
  Añadir ruta
</button>

    </section>

    <section class="mapa-card" aria-label="Mapa de rutas favoritas">
      <h2>Mapa de rutas</h2>
     <iframe
        class="mapa-embed"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d320846.1853174419!2d-78.5953474688905!3d-0.18625022770477181!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91d59a4002427c9f%3A0x44b991e158ef5572!2sQuito!5e1!3m2!1ses!2sec!4v1786583657765!5m2!1ses!2sec"
        width="100%"
        height="400"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        title="Mapa de rutas favoritas en Quito"
        aria-describedby="desc-mapa">
      </iframe>
      <p id="desc-mapa" class="sr-only">El mapa muestra las rutas favoritas del usuario distribuidas por la ciudad, cada una identificada con un color distinto y marcadores en las paradas principales.</p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
