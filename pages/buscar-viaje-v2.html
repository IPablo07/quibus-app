<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buscar viaje en QuiBus, ingresa origen y destino para encontrar rutas de bus">
  <title>QuiBus - Buscar Viaje</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header>
    <img src="../images/logo.png" alt="Logotipo de QuiBus, un autobús estilizado en color rojo">
    <h1>QuiBus</h1>

    <nav aria-label="Menú principal">
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="#">Paradas</a></li>
        <li><a href="#">Favoritos</a></li>
        <li><a href="#">Cuenta</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section aria-labelledby="titulo-buscar" role="search">
    <h2 id="titulo-buscar">Buscar Viaje</h2>

      <form action="#" method="get" aria-label="Formulario de busqueda de viaje">
  <fieldset>
    <legend>Datos del viaje</legend>

    <label for="origen-v2">Origen</label>
    <input type="text" id="origen-v2" name="origen" placeholder="ej. Carolina" autocomplete="off" required>

    <label for="destino-v2">Destino</label>
    <input type="text" id="destino-v2" name="destino" placeholder="ej. Carolina" autocomplete="off" required>

    <button type="submit">Buscar</button>
  </fieldset>
    </form>
    </section>

    <section aria-label="Mapa de rutas">
      <h2>Mapa de rutas</h2>
      <img src="../images/banner.jpg" alt="Mapa de la ciudad con las rutas de bus marcadas en distintos colores">
    </section>

  </main>

  <footer>
    <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
