<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus - Registrarse</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header class="login-header">
    <a href="login.html" class="back-link" aria-label="Volver">←</a>
    <h1>Registrarse</h1>
  </header>

  <main class="login-main">
    <section class="login-card registro-card" aria-label="Formulario de registro">

      <form action="#" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Juan">
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Serrano">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" class="input-error" placeholder="login@gmail.com" aria-describedby="email-error">
            <p id="email-error" class="error-message">Ingresa un correo válido</p>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••••">
          </div>
        </div>

        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="••••••••••">

        <button type="submit">Registrase</button>
      </form>
      <p class="registro-link">Si No Tienes Cuenta? <a href="login.html">Registrate</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
