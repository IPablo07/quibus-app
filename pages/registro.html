<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus - Registrarse</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header class="login-header">
    <a href="login.html" class="back-link" aria-label="Volver">←</a>
    <h1>Registrarse</h1>
  </header>

  <main class="login-main">
    <section class="login-card registro-card" aria-label="Formulario de registro">

      <form action="#" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Juan">
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Serrano">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" class="input-error" placeholder="login@gmail.com" aria-describedby="email-error">
            <p id="email-error" class="error-message">Ingresa un correo válido</p>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••••">
          </div>
        </div>

        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="••••••••••">

        <button type="submit">Registrase</button>
      </form>

      <div class="divider"><span>or</span></div>

      <div class="social-icons">
        <a href="#" aria-label="Instagram" class="icon-link">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        </a>
        <a href="#" aria-label="WhatsApp" class="icon-link">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12a8 8 0 1 1-3.7-6.7L20 4l-1.1 3.9A7.96 7.96 0 0 1 20 12Z"/><path d="M9 10c0 3 2 5 5 5"/></svg>
        </a>
        <a href="#" aria-label="TikTok" class="icon-link">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 4v10.5a3.5 3.5 0 1 1-3-3.46"/><path d="M14 4c.4 2 2 3.6 4 4"/></svg>
        </a>
      </div>

      <p class="registro-link">Si No Tienes Cuenta? <a href="login.html">Registrate</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
