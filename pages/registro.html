<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus - Registrarse</title>
  <link rel="stylesheet" href="../assets/css/styles.css?v=3">
</head>
<body>

  <header class="login-header">
    <a href="login.html" class="back-link" aria-label="Volver">←</a>
    <h1>Registrarse</h1>
  </header>

  <main class="login-main">
    <section class="login-card registro-card" aria-label="Formulario de registro">

      <!-- Ver la nota de login.html sobre novalidate. -->
      <form action="#" method="post" novalidate>
        <p class="form-nota">Los campos marcados con <span class="obligatorio" aria-hidden="true">*</span> son obligatorios.</p>

        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre <span class="obligatorio" aria-hidden="true">*</span></label>
            <input type="text" id="nombre" name="nombre" required autocomplete="given-name"
                   placeholder="Juan" aria-describedby="nombre-error">
            <p id="nombre-error" class="error-message" role="alert" hidden></p>
          </div>
          <div class="form-group">
            <label for="apellido">Apellido <span class="obligatorio" aria-hidden="true">*</span></label>
            <input type="text" id="apellido" name="apellido" required autocomplete="family-name"
                   placeholder="Serrano" aria-describedby="apellido-error">
            <p id="apellido-error" class="error-message" role="alert" hidden></p>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Correo electrónico <span class="obligatorio" aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="nombre@ejemplo.com" aria-describedby="email-error">
            <p id="email-error" class="error-message" role="alert" hidden></p>
          </div>
          <div class="form-group">
            <label for="password">Contraseña <span class="obligatorio" aria-hidden="true">*</span></label>
            <input type="password" id="password" name="password" required autocomplete="new-password"
                   minlength="8" placeholder="••••••••••" aria-describedby="password-error">
            <p id="password-error" class="error-message" role="alert" hidden></p>
          </div>
        </div>

        <label for="confirmar">Confirmar contraseña <span class="obligatorio" aria-hidden="true">*</span></label>
        <input type="password" id="confirmar" name="confirmar" required autocomplete="new-password"
               placeholder="••••••••••" aria-describedby="confirmar-error">
        <p id="confirmar-error" class="error-message" role="alert" hidden></p>

        <button type="submit">Registrarse</button>
      </form>
      <p class="registro-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
  </footer>

  <script src="../assets/js/auth.js"></script>

</body>
</html>
