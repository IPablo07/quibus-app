<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus | Paradas</title>
  <meta name="description" content="Listado de paradas de bus disponibles en QuiBus junto con el mapa de rutas de la ciudad.">
  <meta name="author" content="Mateo">
</head>
<body>
  <a href="#main-content">Saltar al contenido principal</a>

  <header>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
      <rect x="3" y="4" width="18" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/>
      <line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="7.5" cy="18.5" r="1.6" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="16.5" cy="18.5" r="1.6" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <p>QuiBus</p>

    <form role="search">
      <label for="busqueda">Buscar sección</label>
      <input type="search" id="busqueda" name="busqueda" value="Paradas">
    </form>

    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#" aria-current="page">Paradas</a></li>
        <li><a href="#">Favoritos</a></li>
        <li><a href="#">Cuenta</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <h1>Paradas</h1>

    <section aria-labelledby="listado-heading">
      <h2 id="listado-heading">Listado de paradas</h2>
      <ul>
        <li><button type="button">Parada central</button></li>
        <li><button type="button">Parada Norte</button></li>
        <li><button type="button">Parada Sur</button></li>
      </ul>
    </section>

    <section aria-labelledby="mapa-heading">
      <h2 id="mapa-heading">Mapa de rutas</h2>
      <figure>
        <img src="mapa-rutas.png" alt="Mapa de la ciudad con las rutas de bus de QuiBus, mostrando las distintas líneas y sus paradas.">
        <figcaption>Mapa referencial de las rutas y paradas disponibles</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>QuiBus &mdash; Todas las rutas en un solo lugar</p>
  </footer>
</body>
</html>
