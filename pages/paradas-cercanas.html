<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus | Paradas</title>
  <meta name="description" content="Listado de paradas de bus cercanas disponibles en QuiBus junto con el mapa de rutas de la ciudad.">
  <meta name="author" content="Mateo">
  <link rel="stylesheet" href="../lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="../css/styles.css?v=3">
</head>
<body>
  <header aria-label="Cabecera de QuiBus">
     <a href="../index.html" class="icon-btn" aria-label="Volver al inicio">←</a>
    <img src="../images/logo.png" alt="Logotipo de QuiBus, un autobús estilizado en color rojo">
    <h1>QuiBus</h1>

    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="paradas-cercanas.html" aria-current="page">Paradas</a></li>
        <li><a href="favoritos.html">Favoritos</a></li>
        <li><a href="perfil.html">Perfil</a></li>
        <li><a href="login.html">Cuenta</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">

    <section aria-labelledby="titulo-paradas">
      <h2 id="titulo-paradas">Paradas Cercanas</h2>
      <p class="subtitulo">Basado en tu ubicación actual</p>

      <form role="search" class="filtro-paradas" aria-label="Filtrar paradas cercanas">
        <label for="busqueda-parada" class="sr-only">Buscar parada</label>
        <input type="search" id="busqueda-parada" name="busqueda-parada" placeholder="Buscar parada...">
      </form>

      <ul class="lista-paradas">
        <li>
          <button type="button" class="parada-item" aria-label="Parada Parque Carolina, a 200 metros, ruta T1">
            <span class="parada-item__nombre">Parada Parque Carolina</span>
            <span class="parada-item__meta">200 m &middot; Ruta T1</span>
          </button>
        </li>
        <li>
          <button type="button" class="parada-item" aria-label="Parada Carcelén, a 450 metros, ruta T6">
            <span class="parada-item__nombre">Parada Carcelén</span>
            <span class="parada-item__meta">450 m &middot; Ruta T6</span>
          </button>
        </li>
        <li>
          <button type="button" class="parada-item" aria-label="Parada CCI, a 600 metros, rutas T1 y T8">
            <span class="parada-item__nombre">Parada CCI</span>
            <span class="parada-item__meta">600 m &middot; Rutas T1, T8</span>
          </button>
        </li>
      </ul>
    </section>

    <section class="mapa-card" aria-labelledby="mapa-heading">
      <h2 id="mapa-heading">Mapa de rutas</h2>
      <div id="mapa-paradas" class="leaflet-mapa" role="img" aria-label="Mapa con las paradas cercanas" aria-describedby="desc-mapa-paradas"></div>
      <p id="desc-mapa-paradas" class="sr-only">El mapa muestra las paradas cercanas y las rutas de bus que pasan por cada una, distribuidas por la ciudad.</p>
    </section>

  </main>

  <footer aria-label="Pie de página">
    <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
  </footer>

  <script src="../lib/leaflet/leaflet.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/mapa.js"></script>
  <script src="../js/paradas.js"></script>
</body>
</html>
