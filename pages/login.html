<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - QuiBus</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="container">
    <div class="card login-card">
      <h2 class="heading-secondary">Iniciar Sesión</h2>
      
      <!-- Componente adicional: Alerta de Error -->
      <div class="alert alert--error" role="alert">
        <span>⚠ Correo o contraseña incorrectos.</span>
      </div>

      <form class="form">
        <div class="form-group">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input type="email" id="email" class="input-field" placeholder="ejemplo@correo.com">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="input-field" placeholder="••••••••">
        </div>
        <button type="button" class="btn btn--primary">Ingresar</button>
      </form>
    </div>
  </main>
</body>
</html>
