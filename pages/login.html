<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuiBus - Iniciar sesión</title>
  <link rel="stylesheet" href="../assets/css/styles.css?v=3">
</head>
<body>

  <header class="login-header">
    <img src="../assets/images/logo.png" alt="Logotipo de QuiBus, un autobús estilizado en color rojo">
    <h1>QuiBus</h1>
  </header>

  <main class="login-main">
    <section class="login-card" aria-label="Formulario de inicio de sesión">
      <h2>Iniciar sesión</h2>

      <!-- novalidate desactiva los globos del navegador para que los mensajes
           los controle js/auth.js: asi salen siempre en español y anclados al
           campo mediante aria-describedby. La validación sigue siendo la nativa
           (checkValidity), solo cambia como se comunica. -->
      <form action="#" method="post" novalidate>
        <p class="form-nota">Los campos marcados con <span class="obligatorio" aria-hidden="true">*</span> son obligatorios.</p>

        <label for="email">Correo electrónico <span class="obligatorio" aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email"
               placeholder="hola@email.com" aria-describedby="email-error">
        <p id="email-error" class="error-message" role="alert" hidden></p>

        <label for="password">Contraseña <span class="obligatorio" aria-hidden="true">*</span></label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               placeholder="••••••••••" aria-describedby="password-error">
        <p id="password-error" class="error-message" role="alert" hidden></p>

        <button type="submit">Iniciar sesión</button>
      </form>

      <p class="registro-link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuiBus. Todos los derechos reservados.</p>
  </footer>

  <script src="../assets/js/auth.js"></script>

</body>
</html>
